[project]
name = "ai-band-generate-module"
version = "0.1.0"
description = "FastAPI backend for AI music generation and stem separation"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "anyio>=4,<5",
    "bs-roformer-infer==0.1.5",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "imageio-ffmpeg>=0.5.1,<1",
    "numpy==1.23.5",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "rvc-python==0.1.5",
    "setuptools==78.1.0",
    "static-ffmpeg>=3,<4",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
ai-band-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: runs heavyweight model-backed checks",
    "external: calls paid or remote third-party APIs",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
