services:
  api:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ai-band-generate-module:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8010
      # BS-RoFormer 模型缓存随 output 持久化
      BS_ROFORMER_MODELS_DIR: /app/output/.bs-roformer-models
      # 新增：走 SSH 反向隧道到你本机的 7897
      HTTP_PROXY: http://host.docker.internal:7897
      HTTPS_PROXY: http://host.docker.internal:7897
      NO_PROXY: localhost,127.0.0.1,::1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8010}:8010"
    volumes:
      - ./output:/app/output
      - ./assets/rvc:/app/assets/rvc:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]